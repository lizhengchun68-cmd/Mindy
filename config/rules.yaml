global:
  input_dir: file
  output_dir: production
  output_filename: "{date}.xlsx"
  template: config/template.xlsx
  sheet: Sheet1
  order_date_format: "MMDD"
  auto_expand_columns: true
  trigger: cli_manual

input_excluded_from_output:
  - 备注

business_type:
  us_value: "服装专线"
  default_value: "国际电商专递CD（普货）"
  us_country_codes: ["US"]

order_id_format:
  clothing_prefix: "E"
  pet_prefix: "C"
  pattern: "{prefix}-{date}-{order_no}"

country_resolver:
  preset_map_file: config/country_map.yaml
  cache_file: config/country_cache.json
  provider: deepseek
  api_key_env: DEEPSEEK_API_KEY
  match_case_insensitive: true

contact_defaults:
  fallback_phone: "6479375666"

fixed_values:
  是否带电: "否"
  申报价值币种: "USD/美元"

style_aliases:
  短袖: T恤
  老爹帽: 棒球帽
  戴帽卫衣: 带帽卫衣

column_extension:
  columns_per_extra_slot: 12
  builtin_slots: 3
  header_template:
    - "英文申报品名{N}"
    - "中文申报品名{N}"
    - "申报价值（单价）{N}"
    - "成本单价{N}"
    - "商品网址链接{N}"
    - "品名{N}单位重量"
    - "申报品数量{N}"
    - "海关货物编号{N}"
    - "法定数量{N}"
    - "第二数量{N}"
    - "法定计量单位{N}"
    - "第二计量单位{N}"
  tail_columns:
    - 预留字段1
    - 预留字段2
    - 包裹保价金额（CNY)
    - 预留字段4
    - 预留字段5
    - 生产销售单位名称
    - 统一社会信用代码
    - 电商平台名称
    - 进口商公司名称
    - 进口商联系人
    - 进口商电话
    - 进口商地址
    - 进口商邮编
    - 进口商法人番号
    - 电商企业代码
    - 电商企业名称
    - 电商平台编码

